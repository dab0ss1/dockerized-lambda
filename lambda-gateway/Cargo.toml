[package]
name = "lambda-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
lambda-models = { path = "../lambda-models" }
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
validator = { version = "0.20.0", features = ["derive"] }
humantime-serde = "1.1"  # For Duration serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bollard = "0.20.2"
toml = "0.8"
uuid = { version = "1.23.1", features = ["v4"] }
thiserror = "2.0.18"
chrono = "0.4.42"
url = "2.5"
tower = "0.5.3"
tower-http = "0.6.8"
http-body-util = "0.1"
bytes = "1.0"
fastrand = "2.0"
indexmap = "2.14.0"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"